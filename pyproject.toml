[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyhelm-ai-risk-register"
version = "0.1.0"
description = "Explainable cyber risk scoring and executive reporting API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cyhelm"]

[tool.pytest.ini_options]
pythonpath = ["src"]

